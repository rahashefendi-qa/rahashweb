<title>YOUR BRAND Store Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Manrope:wght@300;400;500;600&display=swap">
<style>
/* Single dark look, identical to the production store's design tokens */
:root{
  color-scheme: dark;
  --ink:#0e0e0d; --coal:#151514; --graphite:#1f1e1c; --line:#2c2b28;
  --paper:#f2eee8; --bone:#e6e0d7; --stone:#a39e96; --ash:#75706a;
  --brass:#b89b6a; --brass-soft:#d4c19c; --danger:#d27a6a; --success:#8fb39a;
  --display:"Cormorant Garamond", ui-serif, Georgia, serif;
  --sans:"Manrope", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --gutter:20px;
}
@media (min-width:768px){:root{--gutter:40px}}
@media (min-width:1280px){:root{--gutter:56px}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:1px solid var(--brass);outline-offset:3px}
::selection{background:var(--brass);color:var(--ink)}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
ul{list-style:none;margin:0;padding:0}
.wrap{width:100%;max-width:1440px;margin-inline:auto;padding-inline:var(--gutter)}
.display{font-family:var(--display);font-weight:400;letter-spacing:-.01em;line-height:1.02}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:500}
.muted{color:var(--stone)} .ash{color:var(--ash)} .brass{color:var(--brass-soft)}
.tab{font-variant-numeric:tabular-nums}
.hide{display:none!important}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Demo ribbon */
.ribbon{position:fixed;left:0;right:0;bottom:0;z-index:95;background:var(--brass);color:var(--ink);font-size:12px;text-align:center;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap}
.ribbon a{text-decoration:underline;text-underline-offset:3px;font-weight:600}
body{padding-bottom:34px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;font-size:11.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;transition:background .3s,color .3s,border-color .3s,transform .15s;user-select:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-solid{background:var(--paper);color:var(--ink)} .btn-solid:hover{background:var(--brass-soft)}
.btn-dark{background:var(--ink);color:var(--paper)} .btn-dark:hover{background:var(--graphite)}
.btn-outline{border:1px solid rgba(242,238,232,.3);color:var(--paper)} .btn-outline:hover{border-color:var(--paper);background:var(--paper);color:var(--ink)}
.btn-lg{height:56px;padding:0 32px} .btn-sm{height:40px;padding:0 16px}
.btn-block{width:100%}
.link-line{border-bottom:1px solid rgba(242,238,232,.3);padding-bottom:4px;transition:border-color .3s}
.link-line:hover{border-color:var(--paper)}

/* Header */
.hdr{position:fixed;left:0;right:0;top:0;z-index:50;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid rgba(44,43,40,.7);background:rgba(14,14,13,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:background .5s,border-color .5s}
.hdr.clear{background:transparent;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.hdr-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:64px}
@media (min-width:768px){.hdr-in{height:80px}}
.nav{display:none;gap:28px;white-space:nowrap}
@media (min-width:1024px){.nav{display:flex}.ic-btn.menu-btn{display:none}}
.nav a{position:relative;padding:8px 0;color:rgba(242,238,232,.75);transition:color .3s}
.nav a::after{content:"";position:absolute;left:0;bottom:-2px;height:1px;width:100%;background:var(--brass);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.nav a:hover,.nav a.on{color:var(--paper)} .nav a:hover::after,.nav a.on::after{transform:scaleX(1)}
.logo{font-family:var(--display);font-size:21px;letter-spacing:.32em;padding:0 12px;white-space:nowrap}
@media (min-width:768px){.logo{font-size:25px}}
.hdr-r{display:flex;justify-content:flex-end;gap:4px}
.ic-btn{padding:8px;color:rgba(242,238,232,.8);position:relative;display:inline-flex}
.ic-btn:hover{color:var(--paper)}
.count{position:absolute;right:0;top:2px;min-width:16px;height:16px;border-radius:99px;background:var(--brass);color:var(--ink);font-size:9.5px;font-weight:600;display:grid;place-items:center;padding:0 4px;animation:pop .35s var(--ease)}
@keyframes pop{from{transform:scale(.4);opacity:0}}

/* Overlays */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.62);animation:fade .3s}
@keyframes fade{from{opacity:0}}
.menu{position:fixed;inset:0;z-index:72;background:var(--ink);animation:fade .3s;padding-top:env(safe-area-inset-top,0px);overflow-y:auto}
.menu a.big{display:block;font-family:var(--display);font-size:36px;padding:14px 0;border-bottom:1px solid var(--line);animation:up .6s var(--ease) both}
@keyframes up{from{transform:translateY(16px);opacity:0}}
.drawer{position:fixed;top:0;bottom:0;right:0;z-index:71;width:100%;max-width:440px;background:var(--coal);display:flex;flex-direction:column;animation:slide .55s var(--ease);padding-top:env(safe-area-inset-top,0px)}
@keyframes slide{from{transform:translateX(100%)}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-height:85dvh;overflow-y:auto;background:var(--coal);padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px));animation:rise .45s var(--ease)}
@keyframes rise{from{transform:translateY(100%)}}

/* Intro */
.intro{position:fixed;inset:0;z-index:99;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-direction:column;transition:clip-path .9s cubic-bezier(.76,0,.24,1);clip-path:inset(0 0 0 0)}
.intro.out{clip-path:inset(0 0 100% 0)}
.intro .word{display:flex;overflow:hidden;font-family:var(--display);font-size:clamp(34px,8vw,88px);letter-spacing:.18em}
.intro .word span{display:inline-block;animation:letter .9s var(--ease) both}
@keyframes letter{from{transform:translateY(110%);opacity:0}}
.intro .rule{height:1px;background:var(--brass);width:120px;margin-top:24px;animation:grow 1s .7s var(--ease) both}
@keyframes grow{from{width:0}}
.intro p{margin-top:20px;color:var(--stone);animation:fade .8s 1s both}
.intro .skip{position:absolute;right:24px;bottom:48px;color:var(--stone)}

/* Hero */
.hero{position:relative;height:100svh;min-height:560px;max-height:1000px;overflow:hidden;background:var(--ink)}
.hero .bg{position:absolute;inset:0;will-change:transform}
.hero .bg img{width:100%;height:100%;object-fit:cover;object-position:60% center;animation:heroIn 1.8s var(--ease) both}
@keyframes heroIn{from{transform:scale(1.08);opacity:0}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--ink),rgba(14,14,13,.35) 50%,rgba(14,14,13,.1)),linear-gradient(to right,rgba(14,14,13,.7),transparent 60%)}
.hero-c{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:max(72px,12vh)}
.hero h1{font-size:clamp(54px,11vw,150px);margin-top:20px}
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em;margin-right:.22em}
.hero h1 .w span{display:inline-block;animation:word 1.1s var(--ease) both}
@keyframes word{from{transform:translateY(105%)}}
.hero-row{margin-top:24px;display:flex;flex-direction:column;gap:32px;animation:up .9s .85s var(--ease) both}
@media (min-width:768px){.hero-row{flex-direction:row;align-items:flex-end;justify-content:space-between}}
.hero-row p{max-width:28rem;font-size:17px;color:rgba(242,238,232,.75)}
.hero-row .ctas{display:flex;gap:12px;flex-wrap:wrap}

/* Sections */
.sec{padding-top:112px}
@media (min-width:768px){.sec{padding-top:150px}}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:40px}
@media (min-width:768px){.sh{margin-bottom:56px}}
.sh h2{font-size:clamp(38px,5.5vw,72px);margin-top:12px}
.reveal{animation:revealUp .9s var(--ease) both}
@keyframes revealUp{from{transform:translateY(24px)}}

/* Product grid & card */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 12px}
@media (min-width:768px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:56px 24px}}
@media (min-width:1280px){.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{position:relative}
.card .ph{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--bone);max-width:100%}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease),opacity 1.2s var(--ease)}
.card .ph img.alt{opacity:0}
@media (hover:hover){.card:hover .ph img{transform:scale(1.04)}.card:hover .ph img.alt{opacity:1}.card:hover .ph img.main.has-alt{opacity:0}}
.card.sold .ph img{filter:grayscale(.35)}
.badges{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
.badge{font-size:9.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;padding:4px 10px;background:var(--paper);color:var(--ink)}
.badge.dark{background:rgba(14,14,13,.85);color:var(--paper)} .badge.brass{background:var(--brass);color:var(--ink)}
.acts{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;transition:all .5s var(--ease)}
@media (hover:hover) and (min-width:768px){.acts{opacity:0;transform:translateY(12px)}.card:hover .acts,.card:focus-within .acts{opacity:1;transform:none}}
.acts button{height:40px;min-width:40px;display:grid;place-items:center;backdrop-filter:blur(8px)}
.acts .qv{background:rgba(242,238,232,.92);color:var(--ink)}
.acts .add{background:rgba(14,14,13,.9);color:var(--paper);margin-left:auto}
@media (min-width:768px){.acts .qv{flex:1;display:flex;gap:8px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;height:44px}.acts .add{margin-left:0;width:44px;height:44px}}
.acts .qv .t{display:none} @media (min-width:768px){.acts .qv .t{display:inline}}
.card .meta{margin-top:16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card .meta h3{font-size:15px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta h3 a:hover{color:var(--brass-soft)}
.card .meta small{display:block;font-size:12px;color:var(--ash);margin-top:4px}
.price{display:inline-flex;gap:8px;align-items:baseline;font-variant-numeric:tabular-nums;white-space:nowrap}
.price s{font-size:.85em;color:var(--ash)}

/* Category tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:1024px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}}
.tile{position:relative;display:block;aspect-ratio:3/4;overflow:hidden;background:var(--graphite);max-width:100%}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9;transition:transform 1.4s var(--ease),opacity .6s}
.tile:hover img{transform:scale(1.05);opacity:1}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(14,14,13,.85),rgba(14,14,13,.1) 50%,transparent)}
.tile .cap{position:absolute;left:16px;right:16px;bottom:16px;z-index:1;display:flex;justify-content:space-between;align-items:flex-end}
@media (min-width:768px){.tile .cap{left:24px;right:24px;bottom:24px}}
.tile .cap p{font-family:var(--display);font-size:clamp(24px,3vw,38px);line-height:1.05}
.tile .cap small{font-size:12px;color:var(--stone)}
.tile .cap svg{transition:transform .5s}.tile:hover .cap svg{transform:translate(4px,-4px)}

/* Editorial */
.paper{background:var(--paper);color:var(--ink)}
.ed{display:grid;gap:48px;align-items:center;padding-block:80px}
@media (min-width:768px){.ed{grid-template-columns:1fr 1fr;padding-block:128px}}
.ed .ph{aspect-ratio:4/5;background:var(--bone);overflow:hidden}
.ed .ph img{width:100%;height:100%;object-fit:cover}
.ed h2{font-size:clamp(42px,5vw,74px);margin-top:16px}
.ed p.b{margin-top:24px;max-width:28rem;color:rgba(14,14,13,.7);line-height:1.7}

/* Reasons */
.reasons{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
@media (min-width:640px){.reasons{grid-template-columns:1fr 1fr}}
@media (min-width:1024px){.reasons{grid-template-columns:repeat(3,1fr)}}
.reasons div{background:var(--ink);padding:32px}
@media (min-width:768px){.reasons div{padding:40px}}
.reasons svg{width:22px;height:22px;color:var(--brass);stroke-width:1.2}
.reasons h3{font-family:var(--sans);font-size:17px;margin-top:24px}
.reasons p{margin-top:8px;font-size:14px;color:var(--stone);line-height:1.6}

.cta{position:relative;overflow:hidden;border:1px solid var(--line);padding:80px 24px;text-align:center;background:radial-gradient(ellipse at center,rgba(184,155,106,.12),transparent 65%)}
@media (min-width:768px){.cta{padding:128px 24px}}
.cta h2{font-size:clamp(44px,7vw,96px);margin-top:24px}
.cta p{margin:20px auto 0;max-width:28rem;color:var(--stone)}

/* Footer */
.foot{margin-top:96px;border-top:1px solid var(--line);background:var(--coal)}
.foot-g{display:grid;gap:48px;padding-block:64px}
@media (min-width:768px){.foot-g{grid-template-columns:5fr 2fr 2fr 3fr}}
.foot h4{font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:500;color:var(--ash);margin:0 0 16px}
.foot li{font-size:14px;color:var(--stone);margin-bottom:10px}
.foot li a:hover{color:var(--paper)}
.foot-b{border-top:1px solid var(--line);padding-block:24px;font-size:12px;color:var(--ash);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}

/* Shop */
.page-top{padding-top:112px}
@media (min-width:768px){.page-top{padding-top:144px}}
.page-h{font-size:clamp(48px,8vw,104px);margin-top:12px}
.fbar{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:30;margin-inline:calc(var(--gutter) * -1);padding:12px var(--gutter);background:rgba(14,14,13,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);margin-top:40px}
@media (min-width:768px){.fbar{top:calc(80px + env(safe-area-inset-top,0px))}}
.fbar-r{display:flex;gap:12px;align-items:center}
.search{position:relative;flex:1;max-width:24rem;display:flex;align-items:center}
.search svg{position:absolute;left:12px;color:var(--ash);width:16px;height:16px}
.search input{width:100%;height:44px;border:1px solid var(--line);background:transparent;padding:0 12px 0 40px;font-size:16px}
.search input:focus,.field:focus{outline:none;border-color:var(--stone)}
.fbtn{height:44px;border:1px solid var(--line);padding:0 16px;display:flex;gap:8px;align-items:center;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--stone)}
@media (min-width:1024px){.fbtn{display:none}}
.sort{height:44px;border:1px solid var(--line);background:var(--ink);padding:0 12px;font-size:14px;margin-left:auto}
.fbar-s{margin-top:8px;font-size:12px;color:var(--ash)}
.shop-g{margin-top:40px}
@media (min-width:1024px){.shop-g{display:grid;grid-template-columns:200px 1fr;gap:48px}}
.side{display:none}
@media (min-width:1024px){.side{display:block}.side>div{position:sticky;top:200px}}
.fs{border:0;padding:0;margin:0 0 36px}
.fs legend{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ash);margin-bottom:12px;font-weight:500;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);padding:8px 16px;font-size:12px;color:var(--stone);transition:all .2s}
.chip:hover{color:var(--paper);border-color:var(--stone)}
.chip.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.side .chips{flex-direction:column;align-items:flex-start;gap:4px}
.side .chip{border:0;padding:6px 0;font-size:14px}
.side .chip.on{background:none;color:var(--paper)}
.pr{display:flex;align-items:center;gap:8px}
.pr input{width:78px;height:40px;border:1px solid var(--line);background:transparent;padding:0 10px;font-size:16px}
.chk{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--stone);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--brass)}
.empty{border:1px dashed var(--line);padding:96px 24px;text-align:center}
.empty p.display{font-size:32px}

/* Product */
.crumb{display:none;font-size:12px;color:var(--ash);padding:16px 0}
@media (min-width:768px){.crumb{display:flex;gap:8px}}
.crumb a:hover{color:var(--paper)}
.pd{display:grid;gap:40px;padding-top:64px}
@media (min-width:768px){.pd{padding-top:0}}
@media (min-width:1024px){.pd{grid-template-columns:1.25fr 1fr;gap:64px}}
@media (min-width:1280px){.pd{gap:96px}}
.gal{min-width:0}
@media (min-width:1024px){.gal{display:grid;grid-template-columns:76px 1fr;gap:16px}}
.thumbs{display:none}
@media (min-width:1024px){.thumbs{display:flex;flex-direction:column;gap:12px}}
.thumbs button{aspect-ratio:4/5;background:var(--bone);overflow:hidden;opacity:.45;transition:opacity .3s}
.thumbs button.on{opacity:1;outline:1px solid rgba(242,238,232,.7)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:calc(var(--gutter) * -1)}
.track::-webkit-scrollbar{display:none}
@media (min-width:768px){.track{margin-inline:0}}
@media (min-width:1024px){.track{display:none}}
.track button{flex:0 0 100%;aspect-ratio:4/5;background:var(--bone);scroll-snap-align:center}
.track img{width:100%;height:100%;object-fit:cover}
.mwrap{position:relative}
.dots{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:6px}
.dots span{height:3px;width:6px;border-radius:9px;background:rgba(14,14,13,.35);transition:all .5s}
.dots span.on{width:24px;background:var(--ink)}
@media (min-width:1024px){.dots{display:none}}
.zoom{display:none;position:relative;aspect-ratio:4/5;background:var(--bone);overflow:hidden;cursor:zoom-in}
@media (min-width:1024px){.zoom{display:block}}
.zoom img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease-out;animation:fade .5s}
.pinfo{min-width:0}
@media (min-width:1024px){.pinfo{position:sticky;top:112px;align-self:start}}
.pinfo h1{font-size:clamp(42px,5vw,68px);margin-top:12px}
.pinfo .desc{margin-top:32px;color:var(--stone);line-height:1.7}
.buy{margin-top:32px;display:grid;gap:12px}
.buy .row{display:flex;gap:12px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);height:48px}
.qty button{width:48px;height:100%;display:grid;place-items:center;color:var(--stone)}
.qty button:hover{color:var(--paper)} .qty button:disabled{opacity:.3}
.qty span{min-width:32px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
.qty.sm{height:36px} .qty.sm button{width:36px}
.perks{margin-top:32px;border-block:1px solid var(--line);padding-block:24px;display:grid;gap:12px;font-size:14px;color:var(--stone)}
.perks li{display:flex;gap:12px;align-items:center} .perks svg{color:var(--brass);width:16px;height:16px}
.specs div{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);font-size:14px}
.specs dt{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ash);padding-top:2px}
.specs dd{margin:0;color:var(--stone)}
.details{padding:20px 0;border-bottom:1px solid var(--line)}
.details li{display:flex;gap:12px;font-size:14px;color:var(--stone);margin-top:8px}

function addToCart(slug, qty = 1, open = true) {
  const p = bySlug(slug); if (!p || !available(p)) return;

  if (line) line.qty = Math.min(cap, line.qty + qty); else CART.push({ slug, qty: Math.min(cap, qty) });

  if (open) openCart();
}

    bind: () => {
      $("#sort").value = F.sort;

        let list = PRODUCTS.filter((p) => p.active);

        if (c === "new-arrivals") list = list.filter((p) => p.newArrival); else if (c) list = list.filter((p) => p.cat === c);
        if (F.q) { const q = F.q.toLowerCase(); list = list.filter((p) => [p.name, p.description, p.color, p.material].join(" ").toLowerCase().includes(q)); }
        if (F.inStock) list = list.filter(available);
        const mn = toCents(F.min), mx = toCents(F.max);
        if (F.min && mn) list = list.filter((p) => effective(p) >= mn);
        if (F.max && mx) list = list.filter((p) => effective(p) <= mx);

    <p class="eyebrow muted" style="position:absolute;bottom:56px;left:0;right:0;text-align:center" id="lbc"></p></div>`);
  const im = $("#lbi"), n = p.images.length;
  const show = (j) => { i = (j + n) % n; im.src = img(p.images[i]); im.classList.remove("z"); $("#lbc").textContent = `${i + 1} / ${n} · Tap to zoom`; };
  im.onclick = () => im.classList.toggle("z");
  $("#lbp") && ($("#lbp").onclick = () => show(i - 1)); $("#lbn") && ($("#lbn").onclick = () => show(i + 1));

function normPhone(raw) {
  let d = String(raw).replace(/[^\d+]/g, "");
  if (d.startsWith("+")) d = d.slice(1); if (d.startsWith("00")) d = d.slice(2); if (d.startsWith("961")) d = d.slice(3); if (d.startsWith("0")) d = d.slice(1);
  if (/^(70|71|76|78|79|81)\d{6}$/.test(d)) return `+961 ${d.slice(0, 2)} ${d.slice(2, 5)} ${d.slice(5)}`;
  if (/^3\d{6}$/.test(d) || /^[14-9]\d{6}$/.test(d)) return `+961 ${d[0]} ${d.slice(1, 4)} ${d.slice(4)}`;
  return null;
}

        }
        if (sel === "CANCELLED" && o.stockDeducted) { o.items.forEach((i) => { const p = bySlug(i.slug); if (p) p.stock += i.qty; }); o.stockDeducted = false; }
        o.hist.push({ from: o.status, to: sel, t: Date.now(), note: $("#snote").value.trim() }); o.status = sel; save(); toast("Status updated"); route();
      };
      $("#savenotes").onclick = () => { o.notesInternal = $("#inotes").value; save(); toast("Notes saved"); };
    } };
}
function aProducts() {
  return { html: aph("Products", `${PRODUCTS.length} products`, `<a href="#admin-product-new" class="btn btn-solid btn-sm">Add product</a>`) + `<div class="panel tbl-w"><table><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Status</th><th>Category</th></tr></thead><tbody>${PRODUCTS.map((p) => { const so = !available(p); return `<tr><td><a href="#admin-product-${p.slug}" style="display:flex;gap:12px;align-items:center"><span style="width:40px;aspect-ratio:4/5;background:var(--bone);flex-shrink:0"><img src="${img(p.images[0] || "")}" alt="" style="width:100%;height:100%;object-fit:cover"></span><span>${esc(p.name)}<small>/${esc(p.slug)}</small></span></a></td><td class="tab">${priceHtml(p)}</td><td><input class="stock-in tab" data-stock="${p.slug}" value="${p.stock}" inputmode="numeric" aria-label="Stock quantity"></td><td>${!p.active ? `<span class="tag">Hidden</span>` : ""}${so ? `<span class="tag bad">Sold out</span>` : p.stock <= 3 ? `<span class="tag warn">Low</span>` : `<span class="tag ok">In stock</span>`}${p.featured ? `<span class="tag">Featured</span>` : ""}${p.newArrival ? `<span class="tag">New</span>` : ""}${NOTIFY.includes(p.slug) ? `<span class="tag warn">Waiting list</span>` : ""}</td><td class="muted">${catName(p.cat)}</td></tr>`; }).join("")}</tbody></table></div><p class="ash" style="font-size:12px;margin-top:12px">Tip: change a stock number and press Enter — the store updates instantly. Set a sold-out bag back to 1 to see it return.</p>`,
    bind: () => $$("[data-stock]").forEach((i) => { const saveIt = () => { const p = bySlug(i.dataset.stock), n = parseInt(i.value, 10); if (!Number.isInteger(n) || n < 0) { i.value = p.stock; return; } if (n !== p.stock) { const was = available(p); p.stock = n; if (!was && available(p) && NOTIFY.includes(p.slug)) { NOTIFY = NOTIFY.filter((s) => s !== p.slug); toast("Back in stock — waiting customers would be emailed"); } save(); i.classList.add("saved"); setTimeout(() => route(), 700); } }; i.onblur = saveIt; i.onkeydown = (e) => e.key === "Enter" && i.blur(); }) };
}
function aProduct(slug) {
  const isNew = slug === "new";
  const src = isNew ? { slug: "", name: "", cat: "crossbody", price: 0, salePrice: null, stock: 1, featured: false, newArrival: true, active: true, soldOut: false, color: "", material: "", dimensions: "", strap: "", description: "", details: [], images: [], created: Date.now() } : bySlug(slug);
  if (!src) return { html: `<div class="empty"><p class="display">Product not found</p></div>` };
  const p = structuredClone(src);
  const fld = (id, label, val, o = {}) => `<label style="display:block${o.full ? ";grid-column:1/-1" : ""}"><span class="lbl" style="text-transform:none;letter-spacing:0;font-size:12px">${label}</span>${o.ta ? `<textarea class="field" id="${id}" rows="${o.ta}">${esc(val)}</textarea>` : `<input class="field" id="${id}" value="${esc(val)}" ${o.im ? `inputmode="${o.im}"` : ""}>`}${o.hint ? `<span class="hint">${o.hint}</span>` : ""}</label>`;
  const tog = (id, label, on) => `<div class="tog" data-tog="${id}"><span>${label}</span><span class="sw${on ? " on" : ""}" role="switch" aria-checked="${on}" tabindex="0"></span></div>`;
  return { html: `<a href="#admin-products" class="muted" style="font-size:12px">← Products</a>` + aph(isNew ? "New product" : esc(p.name), isNew ? "" : `<a href="#p-${p.slug}" class="brass" style="text-decoration:underline">View in store →</a>`) + `
    <div class="od"><div style="display:grid;gap:24px;min-width:0">
      <section class="panel"><h2>Basics</h2><div class="pb" style="display:grid;gap:16px">${fld("pn", "Product name", p.name)}${fld("pd", "Description", p.description, { ta: 5 })}${fld("pdt", "Product details", p.details.join("\n"), { ta: 4, hint: "One bullet point per line" })}</div></section>
      <section class="panel"><h2>Images</h2><div class="pb"><div class="imgs" id="imgs"></div><p class="ash" style="font-size:12px;margin-top:12px">The first image is the main image. Use ← → to reorder, ★ to make main. Try uploading your own photo — it stays in this browser only.</p><input type="file" id="file" accept="image/*" multiple class="hide"></div></section>
      <section class="panel"><h2>Specifications</h2><div class="pb fg">${fld("pc", "Colour", p.color)}${fld("pm", "Material", p.material)}${fld("pdi", "Dimensions", p.dimensions)}${fld("ps", "Strap details", p.strap)}</div></section>
    </div>
    <div style="display:grid;gap:24px;height:fit-content">
      <section class="panel"><h2>Pricing</h2><div class="pb" style="display:grid;gap:16px">${fld("pp", "Price (USD)", fromCents(p.price) || "", { im: "decimal" })}${fld("psp", "Sale price (optional)", fromCents(p.salePrice), { im: "decimal", hint: "Leave empty for no sale" })}</div></section>
      <section class="panel"><h2>Inventory</h2><div class="pb" style="display:grid;gap:16px">${fld("pst", "Stock quantity", String(p.stock), { im: "numeric" })}${tog("soldOut", "Mark as sold out", p.soldOut)}</div></section>
      <section class="panel"><h2>Organisation</h2><div class="pb" style="display:grid;gap:16px"><label><span class="lbl" style="text-transform:none;letter-spacing:0;font-size:12px">Category</span><select class="field" id="pcat">${CATS.map((c) => `<option value="${c.slug}"${c.slug === p.cat ? " selected" : ""}>${c.name}</option>`).join("")}</select></label>${tog("active", "Visible in store", p.active)}${tog("featured", "Featured on homepage", p.featured)}${tog("newArrival", "New arrival", p.newArrival)}</div></section>
      <div class="panel pb" style="display:grid;gap:8px"><button class="btn btn-solid btn-block" id="psave">${isNew ? "Create product" : "Save changes"}</button><p id="perr" style="font-size:12px;text-align:center;color:var(--danger)"></p>${isNew ? "" : `<button class="rm" id="pdel" style="justify-self:center;color:var(--danger)">Delete product</button>`}</div>
    </div></div>`,
    bind: () => {
      const drawImgs = () => {
        $("#imgs").innerHTML = p.images.map((f, i) => `<div class="im"><div class="p"><img src="${img(f)}" alt="">${i === 0 ? `<span class="badge" style="position:absolute;left:8px;top:8px">Main</span>` : ""}</div><div class="ctl"><span><button data-mv="${i}" data-d="-1" ${i === 0 ? "disabled" : ""} aria-label="Move left">${ic("left", 13)}</button><button data-mv="${i}" data-d="1" ${i === p.images.length - 1 ? "disabled" : ""} aria-label="Move right">${ic("right", 13)}</button>${i ? `<button data-main="${i}" aria-label="Set as main">${ic("star", 13)}</button>` : ""}</span><button data-del="${i}" aria-label="Remove">${ic("trash", 13)}</button></div></div>`).join("") + (p.images.length < 12 ? `<label class="add" for="file">${ic("img", 22)}Add images</label>` : "");
        $$("[data-mv]").forEach((b) => (b.onclick = () => { const i = +b.dataset.mv, j = i + +b.dataset.d; [p.images[i], p.images[j]] = [p.images[j], p.images[i]]; drawImgs(); }));
        $$("[data-main]").forEach((b) => (b.onclick = () => { const [x] = p.images.splice(+b.dataset.main, 1); p.images.unshift(x); drawImgs(); }));
        $$("[data-del]").forEach((b) => (b.onclick = () => { p.images.splice(+b.dataset.del, 1); drawImgs(); }));
      };
      drawImgs();
      $("#file").onchange = (e) => { [...e.target.files].slice(0, 12 - p.images.length).forEach((file) => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, 1000 / Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = im.width * s; c.height = im.height * s; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); p.images.push(c.toDataURL("image/jpeg", 0.82)); drawImgs(); }; im.src = r.result; }; r.readAsDataURL(file); }); e.target.value = ""; };
      $$("[data-tog]").forEach((t) => { const sw = $(".sw", t); const flip = () => { p[t.dataset.tog] = !p[t.dataset.tog]; sw.classList.toggle("on", p[t.dataset.tog]); sw.setAttribute("aria-checked", p[t.dataset.tog]); }; t.onclick = flip; sw.onkeydown = (e) => (e.key === " " || e.key === "Enter") && (e.preventDefault(), flip()); });
      $("#psave").onclick = () => {
        const name = $("#pn").value.trim(), price = toCents($("#pp").value), sale = $("#psp").value.trim() ? toCents($("#psp").value) : null, stock = parseInt($("#pst").value, 10);
        if (name.length < 2) return ($("#perr").textContent = "Enter a product name.");
        if (!price || price <= 0) return ($("#perr").textContent = "Enter a price.");
        if (sale != null && !(sale < price)) return ($("#perr").textContent = "Sale price must be lower than the regular price.");
        if (!Number.isInteger(stock) || stock < 0) return ($("#perr").textContent = "Stock must be 0 or more.");
        if (!p.images.length) return ($("#perr").textContent = "Add at least one image.");
        Object.assign(p, { name, price, salePrice: sale, stock, description: $("#pd").value.trim(), details: $("#pdt").value.split("\n").map((s) => s.trim()).filter(Boolean), color: $("#pc").value.trim(), material: $("#pm").value.trim(), dimensions: $("#pdi").value.trim(), strap: $("#ps").value.trim(), cat: $("#pcat").value });
        if (isNew) { let s = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "product", b = s, k = 2; while (bySlug(s)) s = `${b}-${k++}`; p.slug = s; p.created = Math.max(...PRODUCTS.map((x) => x.created)) + 1; PRODUCTS.unshift(p); }
        else PRODUCTS[PRODUCTS.findIndex((x) => x.slug === slug)] = p;
        save(); toast(isNew ? "Product created" : "Saved"); go("admin-product-" + p.slug); if (!isNew) route();
      };
      $("#pdel") && ($("#pdel").onclick = (e) => { const b = e.currentTarget; if (b.dataset.sure) { PRODUCTS = PRODUCTS.filter((x) => x.slug !== slug); CART = CART.filter((l) => l.slug !== slug); save(); toast("Product deleted"); go("admin-products"); } else { b.dataset.sure = 1; b.textContent = "Tap again to delete permanently"; } });
    } };
}
function aCustomers() {
  const map = new Map(); ORDERS.forEach((o) => { const c = map.get(o.phone) || { name: o.name, phone: o.phone, email: o.email, n: 0, spent: 0, last: 0 }; c.n++; if (o.status !== "CANCELLED") c.spent += o.total; c.last = Math.max(c.last, o.t); map.set(o.phone, c); });
  return { html: aph("Customers", "Created automatically from orders (matched by phone number).") + `<div class="panel tbl-w"><table><thead><tr><th>Customer</th><th>Phone</th><th>Orders</th><th>Spent</th><th>Last order</th></tr></thead><tbody>${[...map.values()].sort((a, b) => b.last - a.last).map((c) => `<tr><td>${esc(c.name)}${c.email ? `<small>${esc(c.email)}</small>` : ""}</td><td class="tab">${esc(c.phone)}</td><td>${c.n}</td><td class="tab">${money(c.spent)}</td><td class="muted">${fmtDate(c.last)}</td></tr>`).join("")}</tbody></table></div>` };
}
function aSettings() {
  const fld = (id, label, val, o = {}) => `<label style="display:block"><span class="lbl" style="text-transform:none;letter-spacing:0;font-size:12px">${label}</span>${o.ta ? `<textarea class="field" id="${id}" rows="3">${esc(val)}</textarea>` : `<input class="field" id="${id}" value="${esc(val ?? "")}" ${o.ph ? `placeholder="${o.ph}"` : ""} ${o.im ? `inputmode="${o.im}"` : ""}>`}${o.hint ? `<span class="hint">${o.hint}</span>` : ""}</label>`;
  const tog = (id, label, on, hint) => `<div class="tog" data-tog="${id}"><span>${label}${hint ? `<small class="ash" style="display:block;font-size:12px">${hint}</small>` : ""}</span><span class="sw${on ? " on" : ""}" role="switch" aria-checked="${on}" tabindex="0"></span></div>`;
  const t = { cod: S.cod, wish: S.wish };
  return { html: aph("Settings", "Store details, payments and delivery. Changes apply to the website immediately — try renaming the store.") + `<div style="max-width:56rem;display:grid;gap:24px">
    <section class="panel"><h2>Brand</h2><div class="pb fg">${fld("sn", "Store name", S.storeName, { hint: "Shown in the header, intro, emails and page titles" })}${fld("st", "Homepage headline", S.tagline)}</div></section>
    <section class="panel"><h2>Contact & notifications</h2><div class="pb fg">${fld("sa", "Admin email", S.adminEmail, { ph: "you@example.com", hint: "New-order alerts are sent here" })}${fld("sp", "Phone number", S.phone, { ph: "+961 3 123 456" })}${fld("sw", "WhatsApp number", S.whatsapp, { ph: "+961 3 123 456" })}${fld("si", "Instagram URL", S.instagram, { ph: "https://instagram.com/…" })}</div></section>
    <section class="panel"><h2>Payments</h2><div class="pb" style="display:grid;gap:16px">${tog("cod", "Cash on Delivery", S.cod)}${tog("wish", "Wish Money", S.wish, "Customers transfer manually; you verify the payment")}<div class="fg" style="border-left:1px solid rgba(184,155,106,.4);padding-left:16px">${fld("wn", "Wish Money number / account", S.wishNumber)}${fld("wa", "Account holder name", S.wishName)}<div class="full">${fld("wt", "Instructions shown at checkout", S.wishText, { ta: 1 })}</div></div></div></section>
    <section class="panel"><h2>Delivery</h2><div class="pb" style="display:grid;gap:16px"><div class="fg">${fld("df", "Default delivery fee (USD)", fromCents(S.deliveryFee), { im: "decimal" })}${fld("fo", "Free delivery over (optional)", fromCents(S.freeOver), { im: "decimal", ph: "—" })}</div><p class="muted" style="font-size:12px">Fee per governorate — leave empty to use the default fee</p><div class="fee-grid">${Object.keys(GOVS).map((g) => `<label><span>${g}</span><input data-gov="${g}" value="${fromCents(S.govFees[g])}" placeholder="${fromCents(S.deliveryFee)}" inputmode="decimal" aria-label="Delivery fee for ${g}"></label>`).join("")}</div></div></section>
    <div class="panel pb" style="display:flex;gap:16px;align-items:center;position:sticky;bottom:44px"><button class="btn btn-solid" id="ssave">Save settings</button><span id="smsg2" style="font-size:14px"></span></div></div>`,
    bind: () => {
      $$("[data-tog]").forEach((d) => { const sw = $(".sw", d); d.onclick = () => { t[d.dataset.tog] = !t[d.dataset.tog]; sw.classList.toggle("on", t[d.dataset.tog]); }; });
      $("#ssave").onclick = () => {
        const v = (id) => $("#" + id).value.trim();
        if (!v("sn")) return ($("#smsg2").innerHTML = `<span style="color:var(--danger)">Store name is required.</span>`);
        if (!t.cod && !(t.wish && v("wn"))) return ($("#smsg2").innerHTML = `<span style="color:var(--danger)">Enable at least one payment method (Wish Money needs a number).</span>`);
        const gf = {}; $$("[data-gov]").forEach((i) => { if (i.value.trim()) gf[i.dataset.gov] = toCents(i.value); });
        S = { ...S, storeName: v("sn").slice(0, 40), tagline: v("st") || "Carry Confidence.", adminEmail: v("sa"), phone: v("sp"), whatsapp: v("sw"), instagram: v("si"), cod: t.cod, wish: t.wish, wishNumber: v("wn"), wishName: v("wa"), wishText: v("wt"), deliveryFee: toCents(v("df") || "0") || 0, freeOver: v("fo") ? toCents(v("fo")) : null, govFees: gf };
        save(); toast("Settings saved — open the store to see them"); route();
      };
    } };
}

// ---------- ribbon + intro ----------
const rib = document.createElement("div");
rib.className = "ribbon";
rib.innerHTML = `<span>معاينة تفاعلية · Interactive preview — orders stay in this browser</span><a href="#admin">Open admin</a>`;
document.body.appendChild(rib);

function intro() {
  let seen = false; try { seen = sessionStorage.getItem("ybp-intro") === "1"; } catch {}
  if (seen || matchMedia("(prefers-reduced-motion: reduce)").matches || (location.hash || "").startsWith("#admin")) return;
  const el = document.createElement("div"); el.className = "intro"; el.setAttribute("aria-hidden", "true");
  el.innerHTML = `<div class="word">${[...S.storeName].map((l, i) => `<span style="animation-delay:${0.15 + i * 0.045}s">${l === " " ? "&nbsp;" : esc(l)}</span>`).join("")}</div><div class="rule"></div><p class="eyebrow">Men's bags — Lebanon</p><button class="eyebrow skip">Skip</button>`;
  document.body.appendChild(el);
  const done = () => { try { sessionStorage.setItem("ybp-intro", "1"); } catch {} el.classList.add("out"); setTimeout(() => el.remove(), 950); };
  $(".skip", el).onclick = done; setTimeout(done, 2100);
}
intro();
route();
})();
</script>
